server:
  port: 8888

# ========== 数据库基本配置 ==========
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 与 docker-compose 里映射的端口保持一致
#    url: jdbc:mysql://rm-uf674co8dy5525n60ho.mysql.rds.aliyuncs.com:3306/uni_lex?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    url: jdbc:mysql://localhost:3306/demo?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
#    url: jdbc:mysql://8.tcp.cpolar.top:10393/demo?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
#    username: liuxiang
#    password: liuxiang2026
    username: root
    password: 123456
    # 连接池常用参数（hikari 默认）
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      auto-commit: true
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  security:
    user:
      name: none   # 禁用 SpringBoot 默认生成用户

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ========== MyBatis-Plus 补充 ==========
mybatis-plus:
  # XML 文件位置
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 打印 SQL（开发阶段方便调试）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略
      id-type: auto   # 数据库自增
      # 逻辑删除（表里需要 deleted 字段）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: uni-lex-backend-secret-key-must-long-than-256-bits-1234567890
  expiration: 8h   # 过期时间，支持 Duration 表达式

# ========== 禁用 Swagger（来自 aj-captcha 传递依赖） ==========
springfox:
  documentation:
    enabled: false

# 验证码配置
captcha:
  width: 400              # 背景图宽度
  height: 200             # 背景图高度
  puzzle-width: 50        # 拼图块宽度
  puzzle-height: 50       # 拼图块高度
  tolerance: 10            # 位置误差容忍度（像素）